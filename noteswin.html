          function showSection(id){
            hideAll();
            document.getElementById(id).style.display = 'block';
            if (id === 'updates' || id === 'classes') {
              currentView = 'home';
              backButton.style.display = 'none';
            }
          }
          
          function showSubjects(type, cls){
            hideAll();
            document.getElementById('subjects').style.display = 'block';
            document.getElementById('subjectTitle').innerText = "Subjects";
            const list = document.getElementById('subjectList');
            list.innerHTML = "";
            
            currentView = 'subjects';
            currentType = type;
            currentClass = cls;
            backButton.style.display = 'block';
            
            if(data[type] && data[type][cls]){
              Object.keys(data[type][cls]).forEach(sub=>{
                const div = document.createElement('div');
                div.className = "card";
                div.innerText = sub;
                // If it's a direct book, open PDF
                if(type === 'model' || type === 'formula' || type === 'objective' || type === 'syllabus' || type === 'ncert' || type === 'side'){
                  div.onclick = () => openPDF(type, cls, sub);
                } else {
                  // If it's notes, show chapters
                  div.onclick = () => showChapters(type, cls, sub);
                }
                list.appendChild(div);
              });
            }
          }
          
          function showChapters(type, cls, sub){
            hideAll();
            document.getElementById('chapters').style.display = 'block';
            document.getElementById('chapterTitle').innerText = "Chapters";
            const list = document.getElementById('chapterList');
            list.innerHTML = "";
            
            currentView = 'chapters';
            currentSubject = sub;
            backButton.style.display = 'block';
            
            if(data[type] && data[type][cls] && data[type][cls][sub]){
              data[type][cls][sub].forEach(ch => {
                const div = document.createElement('div');
                div.className = "card";
                div.innerText = ch;
                div.onclick = () => openPDF(type, cls, sub, ch);
                list.appendChild(div);
              });
            }
          }
          
          function showExtra(type){
            hideAll();
            document.getElementById('classes').style.display = 'block';
            const titleText = {
                'model': 'Model Papers',
                'formula': 'Formula Book',
                'objective': 'Objective Questions',
                'syllabus': 'Syllabus',
                'ncert': 'NCERT Books',
                'side': 'Side Books'
            }[type] || 'Free Notes';
            
            document.getElementById('classTitle').innerText = `${titleText} - Choose Your Class`;
            const list = document.getElementById('classList');
            list.innerHTML = `
              <div class="card" onclick="showSubjects('${type}', 9)">Class 9</div>
              <div class="card" onclick="showSubjects('${type}', 10)">Class 10</div>
              <div class="card" onclick="showSubjects('${type}', 11)">Class 11</div>
              <div class="card" onclick="showSubjects('${type}', 12)">Class 12</div>
            `;
            currentView = 'classes';
            currentType = type;
            backButton.style.display = 'none';
          }
          
          function openPDF(type, cls, sub, chapter = null){
            let linkName;
            if (chapter) {
              linkName = chapter;
            } else {
              // This is for model papers, formula books, etc.
              linkName = data[type][cls][sub][0];
            }

            if(pdfLinks[linkName] && pdfLinks[linkName] !== ""){
              document.getElementById('pdfViewer').style.display='block';
              document.getElementById('pdfFrame').src=pdfLinks[linkName];
            } else {
              alert("इस PDF को अभी तक अपलोड नहीं किया गया है।");
            }
          }
          
          function closePDF(){
            document.getElementById('pdfViewer').style.display = 'none';
            document.getElementById('pdfFrame').src = '';
          }
          
          function toggleMenu() {
            document.getElementById('sidebar').classList.toggle('active');
          }
          
          function goBack() {
            if (currentView === 'chapters') {
              showSubjects(currentType, currentClass);
            } else if (currentView === 'subjects') {
              goHome();
            } else {
              goHome();
            }
          }
          
          function goHome() {
            hideAll();
            showSection('updates');
            document.getElementById('classes').style.display = 'block';
            document.getElementById('classTitle').innerText = `Free Notes - Choose Your Class`;
            document.getElementById('classList').innerHTML = `
              <div class="card" onclick="showSubjects('notes', 9)">Class 9</div>
              <div class="card" onclick="showSubjects('notes', 10)">Class 10</div>
              <div class="card" onclick="showSubjects('notes', 11)">Class 11</div>
              <div class="card" onclick="showSubjects('notes', 12)">Class 12</div>
            `;
            currentView = 'home';
            backButton.style.display = 'none';
          }
          
          function hideAll(){
            const sections = document.querySelectorAll('.section');
            sections.forEach(sec => sec.style.display = 'none');
          }
          
          // Initial load
          window.onload = goHome;
        </script>
